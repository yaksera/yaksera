<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Yaksera Solutions. IT outsourcing and software development: web applications, mobile apps, AI automation, Figma to launch.">
  <title>Yaksera Solutions</title>
  <defs>
    <radialGradient id="bg" cx="30%" cy="35%" r="85%">
      <stop offset="0" stop-color="#0d2466"/>
      <stop offset="0.55" stop-color="#061440"/>
      <stop offset="1" stop-color="#020820"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="fadeGrid" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fadeGrid)"/></mask>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>

    <!-- One clip per phrase: a rect that wipes open, holds, then wipes closed -->
    <clipPath id="c1"><rect class="wipe w1" x="0" y="0" width="560" height="60"/></clipPath>
    <clipPath id="c2"><rect class="wipe w2" x="0" y="0" width="560" height="60"/></clipPath>
    <clipPath id="c3"><rect class="wipe w3" x="0" y="0" width="560" height="60"/></clipPath>
    <clipPath id="c4"><rect class="wipe w4" x="0" y="0" width="560" height="60"/></clipPath>

    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }

      .orb-a { animation: driftA 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .orb-b { animation: driftB 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes driftA { from { transform: translate(0, 0) scale(1); } to { transform: translate(120px, 40px) scale(1.25); } }
      @keyframes driftB { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-140px, -30px) scale(0.9); } }

      .rise { opacity: 0; animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.8s; } .d4 { animation-delay: 1.1s; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

      .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1s 0.6s cubic-bezier(.65,0,.35,1) forwards; }
      @keyframes grow { to { transform: scaleX(1); } }

      .wipe { transform-origin: 0 0; transform: scaleX(0); animation: wipe 12s cubic-bezier(.65,0,.35,1) infinite; }
      .w1 { animation-delay: 1.2s; } .w2 { animation-delay: 4.2s; } .w3 { animation-delay: 7.2s; } .w4 { animation-delay: 10.2s; }
      @keyframes wipe {
        0%   { transform: scaleX(0); }
        8%   { transform: scaleX(1); }
        20%  { transform: scaleX(1); }
        25%  { transform: scaleX(0); }
        100% { transform: scaleX(0); }
      }

      .spin { transform-origin: 960px 170px; animation: spin 40s linear infinite; }
      .spin-r { transform-origin: 960px 170px; animation: spin 26s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .p2 { animation-delay: 0.8s; } .p3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.25); } }

      @media (prefers-reduced-motion: reduce) {
        .orb-a, .orb-b, .spin, .spin-r, .pulse { animation: none; }
        .rise, .bar { animation-duration: 0.01s; animation-delay: 0s; }
        .wipe { animation: none; }
        .w1 { transform: scaleX(1); }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle class="orb-a" cx="220" cy="260" r="150" fill="#e8313d" opacity="0.28" filter="url(#blur)"/>
    <circle class="orb-b" cx="980" cy="90" r="170" fill="#2f6bff" opacity="0.30" filter="url(#blur)"/>

    <!-- Orbit graphic -->
    <g opacity="0.9">
      <circle cx="960" cy="170" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="960" cy="170" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="4 8"/>
      <circle cx="960" cy="170" r="38" fill="none" stroke="#e8313d" stroke-opacity="0.55"/>
      <g class="spin">
        <circle cx="1078" cy="170" r="6" fill="#e8313d"/>
        <circle cx="842" cy="170" r="4" fill="#ffffff" opacity="0.8"/>
        <circle cx="960" cy="52" r="3.5" fill="#7fa6ff"/>
      </g>
      <g class="spin-r">
        <circle cx="960" cy="248" r="5" fill="#ffffff"/>
        <circle cx="1015" cy="115" r="3.5" fill="#e8313d"/>
      </g>
      <circle class="pulse" cx="960" cy="170" r="7" fill="#ffffff"/>
      <circle class="pulse p2" cx="1100" cy="70" r="3" fill="#ffffff"/>
      <circle class="pulse p3" cx="1130" cy="270" r="3" fill="#e8313d"/>
    </g>

    <!-- Copy -->
    <text class="rise d1" x="72" y="92" fill="#ff5a64" font-size="15" font-weight="700" letter-spacing="4">PREMIUM IT OUTSOURCING PARTNER</text>
    <text class="rise d2" x="70" y="160" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1">Yaksera Solutions</text>
    <rect class="bar" x="72" y="182" width="96" height="4" rx="2" fill="#e8313d"/>

    <text class="rise d3" x="72" y="236" fill="#c9d4f2" font-size="26" font-weight="500">We build</text>
    <g transform="translate(184 208)">
      <g clip-path="url(#c1)"><text x="0" y="28" fill="#ffffff" font-size="26" font-weight="700">web applications.</text></g>
      <g clip-path="url(#c2)"><text x="0" y="28" fill="#ffffff" font-size="26" font-weight="700">mobile apps.</text></g>
      <g clip-path="url(#c3)"><text x="0" y="28" fill="#ffffff" font-size="26" font-weight="700">AI automation.</text></g>
      <g clip-path="url(#c4)"><text x="0" y="28" fill="#ffffff" font-size="26" font-weight="700">products, from Figma to launch.</text></g>
    </g>

    <text class="rise d4" x="72" y="292" fill="#8fa0cc" font-size="16" letter-spacing="0.5">Nepal → worldwide · yaksera.com</text>
  </g>
</svg>
